name: Refresh merged PRs

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-profile-prs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate merged PR table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MIN_STARS: "0" # wxhking：从全部符合条件的外部仓库开始统计，后续可改成 "1000"
          TOP_N: "5"
        run: python3 .github/scripts/render_merged_prs.py
      - name: Commit changes if necessary
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update open-source contributions"
          git push
